<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potree Hybrid Point Cloud Editor</title>

    <link rel="stylesheet" type="text/css" href="/build/potree/potree.css">
    <link rel="stylesheet" type="text/css" href="/libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" type="text/css" href="/libs/spectrum/spectrum.css">
    <link rel="stylesheet" type="text/css" href="/libs/jstree/themes/mixed/style.css">
    <link rel="stylesheet" type="text/css" href="/web/style.css">
</head>
<body>
    <script src="/libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="/libs/spectrum/spectrum.js"></script>
    <script src="/libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="/libs/other/BinaryHeap.js"></script>
    <script src="/libs/tween/tween.min.js"></script>
    <script src="/libs/d3/d3.js"></script>
    <script src="/libs/proj4/proj4.js"></script>
    <script src="/libs/i18next/i18next.js"></script>
    <script src="/libs/jstree/jstree.js"></script>
    <script src="/build/potree/potree.js"></script>
    <script src="/libs/plasio/js/laslaz.js"></script>

    <div id="potree_container">
        <div id="potree_render_area"></div>
        <div id="potree_sidebar_container" style="display:none;"></div>

        <!-- Toast Notification -->
        <div id="toastMsg" class="toast-msg"></div>

        <!-- Floating Selection Banner & Staging Actions -->
        <div id="selectionBanner" class="selection-banner">
            <div class="selection-info-text">
                <span id="selectionSummary">Selected: <strong>0</strong> points</span>
            </div>
            <div id="stageControls" style="display:inline-flex; align-items:center; gap:8px;">
                <div class="hud-divider"></div>
                <label for="quickTreeIdInput" style="font-size:12px; color:#94a3b8; font-weight:500;">Tree ID:</label>
                <input id="quickTreeIdInput" type="number" min="1" max="999999" value="1" style="width:60px; padding:3px 6px; border-radius:4px; border:1px solid #3b82f6; background:#0f172a; color:#fff; font-size:12px;" />
                <button id="btnQuickAssignTree" class="hud-btn" style="background:#059669; border-color:#10b981;" title="Stage Tree ID visually">Stage Tree</button>
                <button id="btnQuickNoise" class="hud-btn" style="background:#b91c1c; border-color:#ef4444;" title="Stage Noise classification (7)">Stage Noise (7)</button>
            </div>
        </div>

        <!-- Inspection Readout Card -->
        <div id="inspectCard" class="inspect-card">
            <h4>
                <span>Point Attributes</span>
                <button id="closeInspect" style="background:transparent;border:none;color:#9ca3af;cursor:pointer;">X</button>
            </h4>
            <table>
                <tr><td>X:</td><td id="inspX">-</td></tr>
                <tr><td>Y:</td><td id="inspY">-</td></tr>
                <tr><td>Z:</td><td id="inspZ">-</td></tr>
                <tr><td>Classification:</td><td id="inspClass">-</td></tr>
                <tr><td>Intensity:</td><td id="inspInt">-</td></tr>
                <tr><td>Tree / ITC ID:</td><td id="inspITC">-</td></tr>
            </table>
        </div>
    </div>

    <script type="module" src="/web/app.js"></script>
</body>
</html>
